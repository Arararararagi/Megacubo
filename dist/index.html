<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megacubo</title>
    <style>
      :root {
        --bg: #14181f;
        --panel: #1c222c;
        --panel-2: #232b38;
        --accent: #3da9fc;
        --accent-2: #2b7fc4;
        --text: #e6e6e6;
        --muted: #9aa4b2;
        --danger: #ef6461;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 14px;
      }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 18px; background: var(--panel);
        border-bottom: 1px solid #00000040;
      }
      header h1 { margin: 0; font-size: 18px; font-weight: 700; }
      header .logo { color: var(--accent); }
      .add-form { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
      .add-form input {
        background: var(--panel-2); border: 1px solid #00000060; color: var(--text);
        padding: 8px 10px; border-radius: 6px; min-width: 220px;
      }
      button {
        background: var(--accent); color: #06121d; border: none; font-weight: 600;
        padding: 8px 14px; border-radius: 6px; cursor: pointer;
      }
      button:hover { background: var(--accent-2); }
      button.ghost { background: var(--panel-2); color: var(--text); }
      button.ghost:hover { background: #2c3645; }
      .tabs { display: flex; gap: 2px; padding: 0 18px; background: var(--panel); }
      .tabs button {
        background: transparent; color: var(--muted); border-radius: 0;
        border-bottom: 2px solid transparent; padding: 10px 14px;
      }
      .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
      .toolbar { display: flex; gap: 8px; padding: 12px 18px; align-items: center; }
      .toolbar input {
        background: var(--panel-2); border: 1px solid #00000060; color: var(--text);
        padding: 8px 10px; border-radius: 6px; flex: 1; max-width: 420px;
      }
      select {
        background: var(--panel-2); border: 1px solid #00000060; color: var(--text);
        padding: 8px 10px; border-radius: 6px;
      }
      main { padding: 0 18px 28px; }
      .status { color: var(--muted); padding: 0 18px 10px; min-height: 18px; }
      .status.error { color: var(--danger); }
      .grid {
        display: grid; gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
      .card {
        background: var(--panel); border: 1px solid #00000040; border-radius: 10px;
        padding: 10px; display: flex; flex-direction: column; gap: 8px;
      }
      .card .thumb {
        width: 100%; height: 120px; object-fit: contain; background: #000;
        border-radius: 6px;
      }
      .card .title { font-weight: 600; line-height: 1.2; }
      .card .meta { color: var(--muted); font-size: 12px; }
      .card .actions { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
      .card .actions button { padding: 6px 10px; font-size: 12px; }
      .row {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        background: var(--panel); border-radius: 8px; margin-bottom: 8px;
      }
      .row .grow { flex: 1; min-width: 0; }
      .row .name { font-weight: 600; }
      .row .sub { color: var(--muted); font-size: 12px; }
      .empty { color: var(--muted); padding: 24px 0; text-align: center; }
      .epg-item { padding: 8px 12px; border-left: 3px solid var(--accent); margin-bottom: 6px; background: var(--panel); border-radius: 4px; }
      .epg-item.now { border-left-color: #54d18a; }
      .epg-item .t { color: var(--muted); font-size: 12px; }
      .epg-item .ti { font-weight: 600; }
      .epg-item .de { color: var(--muted); font-size: 12px; }
      #player-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--panel); border-top: 1px solid #00000060;
        padding: 10px 18px; display: none; align-items: center; gap: 10px;
        z-index: 100;
      }
      #player-bar.active { display: flex; }
      #player-bar .pn { font-weight: 600; min-width: 140px; }
      #player-bar .ctrl { display: flex; gap: 6px; }
      #player-bar input[type="range"] { flex: 1; }
      #player-bar .tm { color: var(--muted); font-size: 12px; min-width: 90px; text-align: right; }
      .panel-box { max-width: 520px; margin: 18px auto; background: var(--panel); border: 1px solid #00000040; border-radius: 12px; padding: 18px 20px; }
      .panel-box h2 { margin-top: 0; }
      .panel-box label { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; font-weight: 600; }
      .panel-box label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
      .panel-box input[type="text"], .panel-box input[type="url"], .panel-box input[type="number"], .panel-box select {
        padding: 8px 10px; border-radius: 8px; border: 1px solid #00000040; background: var(--bg); color: var(--text);
      }
      .row-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
      body.light { --bg: #f3f4f8; --panel: #ffffff; --text: #14161c; --muted: #5b6472; --accent: #2b6cff; --danger: #d23b3b; }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="logo">◉</span> Megacubo</h1>
      <form class="add-form" id="add-form">
        <select id="list-type" title="Playlist type">
          <option value="m3u">M3U</option>
          <option value="xtream">Xtream</option>
        </select>
        <input id="list-url" type="url" placeholder="Playlist URL" required />
        <input id="epg-url" type="url" placeholder="EPG URL (optional)" />
        <button type="submit">Add Playlist</button>
      </form>
    </header>

    <div class="tabs" id="tabs">
      <button data-tab="channels" class="active">Channels</button>
      <button data-tab="search">Search</button>
      <button data-tab="bookmarks">Bookmarks</button>
      <button data-tab="history">History</button>
      <button data-tab="epg">EPG</button>
      <button data-tab="plex">Plex</button>
      <button data-tab="settings">Settings</button>
    </div>

    <div class="status" id="status"></div>

    <main>
      <section id="panel-channels">
        <div class="toolbar">
          <select id="list-select"></select>
          <button class="ghost" id="refresh-epg">Load EPG</button>
          <button class="ghost" id="remove-list">Remove</button>
        </div>
        <div class="grid" id="channels-grid"></div>
      </section>

      <section id="panel-search" hidden>
        <div class="toolbar">
          <input id="search-input" placeholder="Search channels by name or group…" />
          <button id="search-btn">Search</button>
        </div>
        <div class="grid" id="search-grid"></div>
      </section>

      <section id="panel-bookmarks" hidden>
        <div id="bookmarks-list"></div>
      </section>

      <section id="panel-history" hidden>
        <div id="history-list"></div>
      </section>

      <section id="panel-epg" hidden>
        <div class="toolbar">
          <span id="epg-channel">Select a channel and click “EPG” to see its schedule.</span>
        </div>
        <div id="epg-list"></div>
      </section>

      <section id="panel-plex" hidden>
        <div id="plex-login" class="empty">
          <p>Connect your Plex account to browse and play your library.</p>
          <button id="plex-signin">Sign in with Plex</button>
          <div id="plex-pin" style="display:none;margin-top:12px">
            <p>Approve this code in your browser:</p>
            <p>Code: <b id="plex-code"></b></p>
            <p><a id="plex-link" target="_blank" rel="noopener">Open Plex auth…</a></p>
            <p class="meta" id="plex-status">Waiting for approval…</p>
          </div>
        </div>
        <div id="plex-browse" style="display:none">
          <div class="toolbar">
            <select id="plex-library"></select>
            <button class="ghost" id="plex-disconnect">Disconnect</button>
          </div>
          <div class="crumbs" id="plex-crumbs" style="margin:6px 0;color:var(--muted);font-size:13px"></div>
          <div class="grid" id="plex-grid"></div>
        </div>
      </section>

      <section id="panel-settings" hidden>
        <div class="panel-box">
          <h2>Settings</h2>
          <label>Theme
            <select id="set-theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <label>External player (path/command, optional)
            <input id="set-external" placeholder="e.g. /usr/bin/vlc or vlc" />
          </label>
          <label class="check">
            <input type="checkbox" id="set-hw" /> Hardware acceleration (in-app playback)
          </label>
          <label class="check">
            <input type="checkbox" id="set-epg-auto" /> Auto-update EPG on launch
          </label>
          <label>EPG update interval (seconds)
            <input type="number" id="set-epg-int" min="60" step="60" />
          </label>
          <div class="row-actions">
            <button id="set-save">Save</button>
            <span id="set-status" class="meta"></span>
          </div>
        </div>
      </section>
    </main>

    <div id="player-bar">
      <div class="pn" id="player-name">—</div>
      <div class="ctrl">
        <button id="pb-play">Play</button>
        <button id="pb-pause" class="ghost">Pause</button>
        <button id="pb-stop" class="ghost">Stop</button>
      </div>
      <input id="pb-seek" type="range" min="0" max="100" value="0" />
      <div class="tm" id="pb-time">0:00 / 0:00</div>
      <input id="pb-volume" type="range" min="0" max="100" value="100" style="max-width:90px" />
    </div>

    <script>
      const TAURI = window.__TAURI__;
      const invoke = (cmd, args = {}) => TAURI.core.invoke(cmd, args);

      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");
      let lists = [];
      let currentList = null;
      let selectedChannel = null;
      let inAppAvailable = false;
      let currentPlaying = null;
      let timeTimer = null;
      let currentDuration = 0;
      let currentTime = 0;

      // Detect in-app playback support (requires `media` feature build)
      (async () => {
        try {
          await invoke("init_player");
          inAppAvailable = true;
        } catch (e) {
          inAppAvailable = false;
        }
      })();

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg || "";
        statusEl.className = "status" + (isError ? " error" : "");
      }

      function fmtTime(ts) {
        if (!ts) return "";
        const d = new Date(ts * 1000);
        return d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
      }

      function iconFor(ch) {
        return ch.icon || ch.tvg_logo || "";
      }

      function switchTab(name) {
        document.querySelectorAll("#tabs button").forEach((b) =>
          b.classList.toggle("active", b.dataset.tab === name)
        );
        document.querySelectorAll("main section").forEach((s) =>
          (s.hidden = s.id !== "panel-" + name)
        );
      }

      document.querySelectorAll("#tabs button").forEach((b) =>
        b.addEventListener("click", () => switchTab(b.dataset.tab))
      );

      function channelCard(ch, onEpg) {
        const card = document.createElement("div");
        card.className = "card";

        const icon = iconFor(ch);
        if (icon) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.src = icon;
          img.alt = "";
          img.onerror = () => (img.style.display = "none");
          card.appendChild(img);
        }

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = ch.name;
        card.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = [ch.group_title, ch.tvg_country]
          .filter(Boolean)
          .join(" · ");
        card.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "actions";

        const play = document.createElement("button");
        play.textContent = "Play";
        play.onclick = () => playChannel(ch, false);
        actions.appendChild(play);

        if (inAppAvailable) {
          const playApp = document.createElement("button");
          playApp.className = "ghost";
          playApp.textContent = "▶ App";
          playApp.onclick = () => playChannel(ch, true);
          actions.appendChild(playApp);
        }

        const bm = document.createElement("button");
        bm.className = "ghost";
        bm.textContent = "Bookmark";
        bm.onclick = () => bookmarkChannel(ch);
        actions.appendChild(bm);

        const epg = document.createElement("button");
        epg.className = "ghost";
        epg.textContent = "EPG";
        epg.onclick = () => {
          selectedChannel = ch;
          switchTab("epg");
          showEpg(ch);
        };
        actions.appendChild(epg);

        card.appendChild(actions);
        return card;
      }

      function simpleRow(ch) {
        const row = document.createElement("div");
        row.className = "row";
        const grow = document.createElement("div");
        grow.className = "grow";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = ch.name || ch.channel_name;
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = ch.url || ch.channel_url || "";
        grow.appendChild(name);
        grow.appendChild(sub);
        row.appendChild(grow);

        const play = document.createElement("button");
        play.textContent = "Play";
        play.onclick = () => playChannel(ch, false);
        row.appendChild(play);

        if (inAppAvailable) {
          const playApp = document.createElement("button");
          playApp.className = "ghost";
          playApp.textContent = "▶ App";
          playApp.onclick = () => playChannel(ch, true);
          row.appendChild(playApp);
        }

        return row;
      }

      async function playChannel(ch, inApp) {
        const url = ch.url || ch.channel_url;
        const name = ch.name || ch.channel_name;
        const icon = iconFor(ch) || ch.icon;

        try {
          if (inApp && inAppAvailable) {
            closePlayerBar();
            await invoke("play_in_app", { url });
            currentPlaying = { name, url };
            openPlayerBar(name);
            await invoke("add_history", {
              channelName: name,
              channelUrl: url,
              icon: icon || null,
              duration: null,
            });
          } else {
            await invoke("launch_external_player", { url });
            await invoke("add_history", {
              channelName: name,
              channelUrl: url,
              icon: icon || null,
              duration: null,
            });
          }
          if (currentTab() === "history") loadHistory();
        } catch (e) {
          setStatus("Failed to play: " + e, true);
        }
      }

      function openPlayerBar(name) {
        $("player-name").textContent = name;
        $("player-bar").classList.add("active");
        startTimer();
      }

      function closePlayerBar() {
        $("player-bar").classList.remove("active");
        currentPlaying = null;
        stopTimer();
      }

      function startTimer() {
        stopTimer();
        timeTimer = setInterval(updateTime, 1000);
      }
      function stopTimer() {
        if (timeTimer) { clearInterval(timeTimer); timeTimer = null; }
      }

      async function updateTime() {
        try {
          const [pos, dur] = await Promise.all([
            invoke("get_time"),
            invoke("get_duration"),
          ]);
          if (pos == null || dur == null || dur <= 0) return;
          currentTime = pos;
          currentDuration = dur;
          $("pb-time").textContent = fmtDur(pos) + " / " + fmtDur(dur);
          $("pb-seek").value = Math.min(100, Math.round((pos / dur) * 100));
        } catch (e) { /* ignore */ }
      }

      function fmtDur(sec) {
        if (sec == null) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + String(s).padStart(2, "0");
      }

      async function pausePlayback() {
        try { await invoke("pause_in_app"); } catch (e) { setStatus("Pause failed: " + e, true); }
      }
      async function resumePlayback() {
        try { await invoke("resume_in_app"); } catch (e) { setStatus("Resume failed: " + e, true); }
      }
      async function stopPlayback() {
        try {
          await invoke("stop_in_app");
          closePlayerBar();
        } catch (e) { setStatus("Stop failed: " + e, true); }
      }
      async function seekPlayback(val) {
        try { await invoke("seek", { pos: val }); } catch (e) { /* ignore */ }
      }
      async function setVol(v) {
        try { await invoke("set_volume", { volume: v }); } catch (e) { /* ignore */ }
      }

      $("pb-play").onclick = resumePlayback;
      $("pb-pause").onclick = pausePlayback;
      $("pb-stop").onclick = stopPlayback;
      $("pb-seek").oninput = (e) => {
        const pct = parseFloat(e.target.value);
        if (currentDuration > 0) seekPlayback((pct / 100) * currentDuration);
      };
      $("pb-volume").oninput = (e) => setVol(parseFloat(e.target.value));

      async function bookmarkChannel(ch) {
        try {
          await invoke("add_bookmark", {
            channelName: ch.name,
            channelUrl: ch.url,
            icon: iconFor(ch) || null,
          });
          setStatus("Bookmarked " + ch.name);
          if (currentTab() === "bookmarks") loadBookmarks();
        } catch (e) {
          setStatus("Failed to bookmark: " + e, true);
        }
      }

      async function showEpg(ch) {
        const id = ch.tvg_id || ch.name;
        $("epg-channel").textContent = "EPG for " + (ch.name || id);
        $("epg-list").innerHTML = "";
        try {
          const progs = await invoke("get_epg_schedule", { channelId: id, limit: 30 });
          if (!progs.length) {
            $("epg-list").innerHTML = '<div class="empty">No EPG data for this channel.</div>';
            return;
          }
          const now = Math.floor(Date.now() / 1000);
          progs.forEach((p) => {
            const item = document.createElement("div");
            const isNow = p.start_time <= now && p.end_time >= now;
            item.className = "epg-item" + (isNow ? " now" : "");
            const t = document.createElement("div");
            t.className = "t";
            t.textContent = fmtTime(p.start_time) + " – " + fmtTime(p.end_time);
            const ti = document.createElement("div");
            ti.className = "ti";
            ti.textContent = p.title;
            item.appendChild(t);
            item.appendChild(ti);
            if (p.description) {
              const de = document.createElement("div");
              de.className = "de";
              de.textContent = p.description;
              item.appendChild(de);
            }
            $("epg-list").appendChild(item);
          });
        } catch (e) {
          setStatus("Failed to load EPG: " + e, true);
        }
      }

      async function loadLists() {
        try {
          lists = await invoke("get_lists");
          const sel = $("list-select");
          sel.innerHTML = "";
          if (!lists.length) {
            sel.innerHTML = "<option>No playlists yet — add one above.</option>";
            $("channels-grid").innerHTML = "";
            return;
          }
          lists.forEach((l) => {
            const o = document.createElement("option");
            o.value = l.url;
            o.textContent = (l.name || l.url) + (l.epg_url ? " (EPG)" : "");
            sel.appendChild(o);
          });
          currentList = lists[0];
          sel.value = currentList.url;
          await loadChannels(currentList.url);
        } catch (e) {
          setStatus("Failed to load lists: " + e, true);
        }
      }

      async function loadChannels(url) {
        try {
          setStatus("Loading channels…");
          const channels = await invoke("get_channels", { listUrl: url });
          const grid = $("channels-grid");
          grid.innerHTML = "";
          if (!channels.length) {
            grid.innerHTML = '<div class="empty">No channels. Add a playlist or click “Load EPG”? Channels come from M3U playlists.</div>';
            setStatus("");
            return;
          }
          channels.forEach((ch) => grid.appendChild(channelCard(ch)));
          setStatus(channels.length + " channels");
        } catch (e) {
          setStatus("Failed to load channels: " + e, true);
        }
      }

      $("list-select").addEventListener("change", (e) => {
        currentList = lists.find((l) => l.url === e.target.value) || null;
        loadChannels(e.target.value);
      });

      $("refresh-epg").addEventListener("click", async () => {
        if (!currentList || !currentList.epg_url) {
          setStatus("This playlist has no EPG URL. Add one when creating the playlist.", true);
          return;
        }
        try {
          setStatus("Fetching EPG…");
          const msg = await invoke("refresh_epg", {
            listUrl: currentList.url,
            epgUrl: currentList.epg_url,
          });
          setStatus(msg);
        } catch (e) {
          setStatus("EPG refresh failed: " + e, true);
        }
      });

      $("remove-list").addEventListener("click", async () => {
        if (!currentList) {
          setStatus("No playlist selected.", true);
          return;
        }
        if (!confirm("Remove playlist “" + (currentList.name || currentList.url) + "” and all its channels?")) {
          return;
        }
        try {
          setStatus("Removing playlist…");
          const msg = await invoke("remove_list", { listUrl: currentList.url });
          setStatus(msg);
          await loadLists();
        } catch (e) {
          setStatus("Failed to remove playlist: " + e, true);
        }
      });

      $("add-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const type = $("list-type").value;
        const url = $("list-url").value.trim();
        const epg = $("epg-url").value.trim();
        if (!url) return;
        try {
          setStatus("Adding playlist…");
          let msg;
          if (type === "xtream") {
            msg = await invoke("add_xtream_list", { url });
          } else {
            msg = await invoke("add_m3u_list", {
              url,
              epgUrl: epg || null,
            });
          }
          setStatus(msg);
          $("list-url").value = "";
          $("epg-url").value = "";
          await loadLists();
        } catch (e) {
          setStatus("Failed to add playlist: " + e, true);
        }
      });

      // EPG field only applies to M3U lists.
      $("list-type").addEventListener("change", () => {
        $("epg-url").style.display =
          $("list-type").value === "xtream" ? "none" : "";
      });

      async function doSearch() {
        const q = $("search-input").value.trim();
        if (!q) return;
        try {
          setStatus("Searching…");
          const results = await invoke("search_channels", { query: q, limit: 200 });
          const grid = $("search-grid");
          grid.innerHTML = "";
          if (!results.length) {
            grid.innerHTML = '<div class="empty">No results.</div>';
            setStatus("");
            return;
          }
          results.forEach((ch) => grid.appendChild(channelCard(ch)));
          setStatus(results.length + " results");
        } catch (e) {
          setStatus("Search failed: " + e, true);
        }
      }
      $("search-btn").addEventListener("click", doSearch);
      $("search-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doSearch();
      });

      async function loadBookmarks() {
        try {
          const bms = await invoke("get_bookmarks");
          const list = $("bookmarks-list");
          list.innerHTML = "";
          if (!bms.length) {
            list.innerHTML = '<div class="empty">No bookmarks yet.</div>';
            return;
          }
          bms.forEach((b) => list.appendChild(simpleRow({ name: b[0], url: b[1], icon: b[2] })));
        } catch (e) {
          setStatus("Failed to load bookmarks: " + e, true);
        }
      }

      async function loadHistory() {
        try {
          const hist = await invoke("get_history", { limit: 50 });
          const list = $("history-list");
          list.innerHTML = "";
          if (!hist.length) {
            list.innerHTML = '<div class="empty">No history yet.</div>';
            return;
          }
          hist.forEach((h) =>
            list.appendChild(simpleRow({ name: h[0], url: h[1], icon: h[2] }))
          );
        } catch (e) {
          setStatus("Failed to load history: " + e, true);
        }
      }

      function currentTab() {
        const a = document.querySelector("#tabs button.active");
        return a ? a.dataset.tab : "channels";
      }
      document.querySelectorAll("#tabs button").forEach((b) =>
        b.addEventListener("click", () => {
          const t = b.dataset.tab;
          if (t === "bookmarks") loadBookmarks();
          if (t === "history") loadHistory();
          if (t === "plex") plexInit();
          if (t === "settings") loadSettings();
        })
      );

      // ---------- Plex ----------
      let plexNav = [];
      let plexPinTimer = null;

      async function plexInit() {
        try {
          await invoke("plex_libraries");
          $("plex-login").style.display = "none";
          $("plex-browse").style.display = "block";
          await plexLoadLibraries();
        } catch (e) {
          $("plex-login").style.display = "block";
          $("plex-browse").style.display = "none";
        }
      }

      async function plexLoadLibraries() {
        const libs = await invoke("plex_libraries");
        const sel = $("plex-library");
        sel.innerHTML = "";
        libs.forEach((l) => {
          const o = document.createElement("option");
          o.value = l.key;
          o.textContent = l.title + " (" + l.kind + ")";
          sel.appendChild(o);
        });
        if (libs.length) plexBrowseSection(libs[0].key, libs[0].title);
      }

      $("plex-signin").addEventListener("click", async () => {
        try {
          const pin = await invoke("plex_login_start");
          $("plex-pin").style.display = "block";
          $("plex-code").textContent = pin.code;
          $("plex-link").href = pin.linkUrl;
          setStatus("Approve the code on plex.tv…");
          if (plexPinTimer) clearInterval(plexPinTimer);
          plexPinTimer = setInterval(async () => {
            try {
              const token = await invoke("plex_login_poll", { pinId: pin.id });
              if (token) {
                clearInterval(plexPinTimer);
                plexPinTimer = null;
                const servers = await invoke("plex_servers", { token });
                if (!servers.length) {
                  setStatus("No Plex servers found for this account.", true);
                  return;
                }
                const s = servers[0];
                await invoke("plex_save_server", {
                  serverUrl: s.url,
                  name: s.name,
                  token,
                });
                setStatus("Connected to " + s.name);
                $("plex-pin").style.display = "none";
                $("plex-login").style.display = "none";
                $("plex-browse").style.display = "block";
                await plexLoadLibraries();
              }
            } catch (e) {
              clearInterval(plexPinTimer);
              plexPinTimer = null;
              setStatus("Plex login failed: " + e, true);
            }
          }, 2000);
        } catch (e) {
          setStatus("Plex login start failed: " + e, true);
        }
      });

      $("plex-disconnect").addEventListener("click", async () => {
        try {
          await invoke("plex_save_server", { serverUrl: "", name: "", token: "" });
          plexNav = [];
          $("plex-browse").style.display = "none";
          $("plex-login").style.display = "block";
          setStatus("Disconnected from Plex");
        } catch (e) {
          setStatus("Failed to disconnect: " + e, true);
        }
      });

      $("plex-library").addEventListener("change", (e) => {
        const o = e.target.selectedOptions[0];
        plexBrowseSection(e.target.value, o ? o.textContent : "");
      });

      async function plexBrowseSection(key, title) {
        plexNav = [];
        try {
          const items = await invoke("plex_browse", { section: key });
          plexRenderCrumbs(title);
          plexShowItems(items);
        } catch (e) {
          setStatus("Failed to load library: " + e, true);
        }
      }

      function plexRenderCrumbs(current) {
        const cr = $("plex-crumbs");
        cr.innerHTML = "";
        plexNav.forEach((n, i) => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = n.title;
          a.style.cursor = "pointer";
          a.style.color = "var(--accent)";
          a.addEventListener("click", () => {
            plexNav = plexNav.slice(0, i);
            plexOpenByNav(n);
          });
          cr.appendChild(a);
          cr.appendChild(document.createTextNode(" / "));
        });
        if (current) {
          const s = document.createElement("span");
          s.textContent = current;
          cr.appendChild(s);
        }
      }

      async function plexOpenByNav(n) {
        if (n.kind === "show") {
          const items = await invoke("plex_seasons", { ratingKey: n.key });
          plexShowItems(items);
          plexRenderCrumbs(n.title);
        } else if (n.kind === "season") {
          const items = await invoke("plex_episodes", { ratingKey: n.key });
          plexShowItems(items);
          plexRenderCrumbs(n.title);
        }
      }

      async function plexShowItems(items) {
        const grid = $("plex-grid");
        grid.innerHTML = "";
        if (!items.length) {
          grid.innerHTML = '<div class="empty">Empty.</div>';
          return;
        }
        items.forEach((it) => grid.appendChild(plexCard(it)));
      }

      function plexCard(it) {
        const card = document.createElement("div");
        card.className = "card";

        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.src = it.thumb || "";
        thumb.alt = it.title;
        card.appendChild(thumb);

        const title = document.createElement("div");
        title.className = "title";
        let meta = it.year ? String(it.year) : "";
        if (it.index != null) {
          meta = (it.kind === "season" ? "Season " : "Ep ") + it.index + (meta ? " · " + meta : "");
        }
        title.textContent = it.title + (meta ? " (" + meta + ")" : "");
        card.appendChild(title);

        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = it.kind;
        card.appendChild(m);

        const actions = document.createElement("div");
        actions.className = "actions";
        if (it.kind === "movie" || it.kind === "episode") {
          const playApp = document.createElement("button");
          playApp.textContent = "▶ App";
          playApp.addEventListener("click", () => plexPlay(it, true));
          const playExt = document.createElement("button");
          playExt.className = "ghost";
          playExt.textContent = "Play";
          playExt.addEventListener("click", () => plexPlay(it, false));
          actions.appendChild(playApp);
          actions.appendChild(playExt);
        } else {
          const open = document.createElement("button");
          open.textContent = "Open";
          open.addEventListener("click", () => {
            plexNav.push({ title: it.title, key: it.rating_key, kind: it.kind });
            plexOpenByNav({ title: it.title, key: it.rating_key, kind: it.kind });
          });
          actions.appendChild(open);
        }

        const watched = document.createElement("button");
        watched.className = "ghost";
        watched.textContent = "✓ Watched";
        watched.addEventListener("click", async () => {
          try {
            await invoke("plex_set_watched", { ratingKey: it.rating_key, watched: true });
            setStatus("Marked “" + it.title + "” as watched");
          } catch (e) {
            setStatus("Failed: " + e, true);
          }
        });
        const unwatched = document.createElement("button");
        unwatched.className = "ghost";
        unwatched.textContent = "↺ Unwatch";
        unwatched.addEventListener("click", async () => {
          try {
            await invoke("plex_set_watched", { ratingKey: it.rating_key, watched: false });
            setStatus("Marked “" + it.title + "” as unwatched");
          } catch (e) {
            setStatus("Failed: " + e, true);
          }
        });
        const refresh = document.createElement("button");
        refresh.className = "ghost";
        refresh.textContent = "⟳ Refresh";
        refresh.addEventListener("click", async () => {
          try {
            await invoke("plex_refresh", { ratingKey: it.rating_key });
            setStatus("Refreshing metadata for “" + it.title + "”…");
          } catch (e) {
            setStatus("Failed: " + e, true);
          }
        });
        actions.appendChild(watched);
        actions.appendChild(unwatched);
        actions.appendChild(refresh);
        card.appendChild(actions);
        return card;
      }

      async function plexPlay(it, inApp) {
        if (inApp === undefined) inApp = inAppAvailable;
        try {
          setStatus("Resolving “" + it.title + "”…");
          const p = await invoke("plex_item_url", { ratingKey: it.rating_key });
          await playChannel({ url: p.url, name: p.title, icon: p.thumb }, inApp);
          setStatus("Playing " + p.title);
        } catch (e) {
          setStatus("Failed to play: " + e, true);
        }
      }

      // ---------- Settings ----------
      function applyTheme(name) {
        document.body.classList.toggle("light", name === "light");
      }

      async function loadSettings() {
        try {
          const s = await invoke("get_settings");
          $("set-theme").value = s.theme || "dark";
          $("set-external").value = s.external_player || "";
          $("set-hw").checked = !!s.hardware_acceleration;
          $("set-epg-auto").checked = !!s.auto_update_epg;
          $("set-epg-int").value = s.epg_update_interval_secs || 1800;
          $("set-status").textContent = "";
        } catch (e) {
          setStatus("Failed to load settings: " + e, true);
        }
      }

      $("set-save").addEventListener("click", async () => {
        const s = {
          language: "en",
          theme: $("set-theme").value,
          hardware_acceleration: $("set-hw").checked,
          external_player: $("set-external").value.trim() || null,
          auto_update_epg: $("set-epg-auto").checked,
          epg_update_interval_secs: parseInt($("set-epg-int").value, 10) || 1800,
        };
        try {
          await invoke("set_settings", { settings: s });
          applyTheme(s.theme);
          $("set-status").textContent = "Saved.";
          setStatus("Settings saved");
        } catch (e) {
          $("set-status").textContent = "Error: " + e;
          setStatus("Failed to save settings: " + e, true);
        }
      });

      // Boot
      (async () => {
        try {
          const s = await invoke("get_settings");
          applyTheme(s.theme || "dark");
        } catch (e) { /* ignore */ }
        try {
          await loadLists();
        } catch (e) {
          setStatus("Initialization error: " + e, true);
        }
      })();
    </script>
  </body>
</html>
